[project]
name = "mis"
version = "0.0.1"
description = "MetaInstrumentStudio — AI-native scientific instrument engineering platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "pint>=0.26.2",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "python-ulid>=4.1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Markdown docs contain illustrative snippets; keep them as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
